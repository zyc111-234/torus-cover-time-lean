name: Verify cover-time theorem

on:
  push:
    paths:
      - 'torus-cover-time-source.zip'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MATHLIB_CACHE_DIR: /tmp/mathlib-download-cache
    steps:
      - name: Free disk space on the temporary runner
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          df -i .
          # These preinstalled SDKs are not used by this Lean-only job.
          # This runs on the disposable GitHub runner, not on your computer.
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h .
          df -i .
      - name: Checkout uploaded files
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 -m zipfile -e torus-cover-time-source.zip proof
          test -f proof/Scalar.lean
          test -f proof/lakefile.lean
          test -f proof/lean-toolchain
          test -f proof/scripts/CheckAxioms.lean
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download declared toolchain and public mathlib cache
        working-directory: proof
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          df -h .
          lake exe cache get
          df -h .
      - name: Remove downloaded cache archives after successful extraction
        working-directory: proof
        shell: bash
        run: |
          set -euo pipefail
          # Removes downloaded .ltar archives; keeps unpacked .lake build files.
          lake exe cache clean!
          df -h .
          df -i .
      - name: Select project cache for the declared dependency versions
        id: cache-key
        working-directory: proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          toolchain = Path('lean-toolchain').read_text(encoding='utf-8-sig').strip()
          toolchain = re.sub(r'[^A-Za-z0-9_.-]', '-', toolchain)
          manifest = json.loads(Path('lake-manifest.json').read_text(encoding='utf-8-sig'))
          mathlib = next(p for p in manifest['packages'] if p['name'] == 'mathlib')
          prefix = f"lean-project-organized-v1-{os.environ['RUNNER_OS']}-{os.environ['RUNNER_ARCH']}-{toolchain}-{mathlib['rev']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'prefix={prefix}\n')
          PY
      - name: Restore previously compiled project modules
        id: project-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          # Keep the complete project build tree, including Lake traces and generated C.
          # Dependencies are downloaded from the public mathlib cache above.
          path: proof/.lake/build
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}-
      - name: Check the affected coloring modules first
        id: coloring-build
        working-directory: proof
        shell: bash
        run: |
          lake build \
            Solutions.Blocks.D.R24.T4MacroColoring \
            Solutions.Blocks.D.R24.T4LocatorColoring \
            Solutions.Blocks.D.R25.Base.S07Geometry \
            Solutions.Blocks.D.R25.Base.S08Locator
      - name: Build the scalar theorem from project sources
        working-directory: proof
        run: lake build Scalar
      - name: Check central canonical contracts
        working-directory: proof
        run: lake env lean scripts/CheckContracts.lean
      - name: Audit final axioms and proof dependencies
        working-directory: proof
        run: lake env lean scripts/CheckAxioms.lean
      - name: Save completed modules even if the build failed
        if: ${{ always() && !cancelled() && (steps.coloring-build.outcome == 'success' || steps.coloring-build.outcome == 'failure') }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: proof/.lake/build
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report final disk usage even if verification fails
        if: always()
        shell: bash
        run: |
          df -h .
          df -i .
          du -sh "$HOME/.elan" "$MATHLIB_CACHE_DIR" proof/.lake/packages proof/.lake/build 2>/dev/null || true
